<app-header
  title="App version / Device info"
  [showBackButton]="true"
  defaultHref="/home">
</app-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item>
      <ion-label>App version</ion-label>
      <ion-note slot="end">{{ version }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>Modelo</ion-label>
      <ion-note slot="end">{{ info.model }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>Plataforma</ion-label>
      <ion-note slot="end">{{ info.platform }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>UUID</ion-label>
      <ion-note slot="end">{{ info.uuid }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>Versión OS</ion-label>
      <ion-note slot="end">{{ info.version }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>Fabricante</ion-label>
      <ion-note slot="end">{{ info.manufacturer }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-label>Emulador</ion-label>
      <ion-note slot="end">{{ info.isVirtual }}</ion-note>
    </ion-item>

  </ion-list>

</ion-content>
